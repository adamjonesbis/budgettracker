<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Ledger — Travel Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14181a;
    --surface:#1c2224;
    --surface-alt:#222a2c;
    --border:#2c3436;
    --text:#ede9e1;
    --text-dim:#8fa09a;
    --accent:#d9a441;
    --accent-dim:#7a6435;
    --good:#6b9e78;
    --over:#c4553d;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
    padding:0 0 60px;
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 20px;}

  header{
    padding:40px 20px 28px;
    border-bottom:1px solid var(--border);
    margin-bottom:28px;
  }
  header .inner{max-width:920px;margin:0 auto;}
  .kicker{color:var(--accent);font-size:12px;letter-spacing:0.08em;margin-bottom:10px;}
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(28px, 5vw, 42px);
    line-height:1.1;
  }
  .subline{color:var(--text-dim);font-size:13px;margin-top:10px;}

  .week-tabs{
    display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;
  }
  .week-tab{
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:8px 14px;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    cursor:pointer;
    border-radius:3px;
  }
  .week-tab.active{
    border-color:var(--accent);
    color:var(--accent);
  }

  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
    gap:14px;
    margin-bottom:32px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:4px;
    padding:18px;
  }
  .card .cat{font-family:'Fraunces', serif;font-size:17px;margin-bottom:14px;}
  .card .nums{display:flex;align-items:baseline;gap:6px;margin-bottom:10px;}
  .card .spent{font-size:22px;font-weight:600;}
  .card .of-budget{color:var(--text-dim);font-size:12px;}
  .bar-track{
    height:6px;background:var(--surface-alt);border-radius:3px;overflow:hidden;
  }
  .bar-fill{height:100%;border-radius:3px;background:var(--good);transition:width .25s;}
  .bar-fill.over{background:var(--over);}
  .card .status{font-size:11px;color:var(--text-dim);margin-top:8px;}
  .card .status.over-text{color:var(--over);}

  .total-strip{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--surface-alt);
    border:1px solid var(--border);
    border-radius:4px;
    padding:16px 18px;
    margin-bottom:32px;
  }
  .total-strip .label{color:var(--text-dim);font-size:12px;}
  .total-strip .value{font-family:'Fraunces', serif;font-size:24px;}
  .total-strip .value.over{color:var(--over);}
  .total-strip .value.good{color:var(--good);}

  section.panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:4px;
    padding:22px;
    margin-bottom:20px;
  }
  .panel h2{
    font-family:'Fraunces', serif;font-weight:500;font-size:18px;margin-bottom:16px;
  }

  form.entry{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
  }
  form.entry .full{grid-column:1/-1;}
  label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:5px;}
  input, select, textarea{
    width:100%;
    background:var(--surface-alt);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    padding:9px 10px;
    border-radius:3px;
  }
  input:focus, select:focus, textarea:focus{outline:1px solid var(--accent);}
  button{
    background:var(--accent);
    color:#1a1a1a;
    border:none;
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    font-size:13px;
    padding:11px 18px;
    border-radius:3px;
    cursor:pointer;
    margin-top:4px;
  }
  button:hover{background:#e8b352;}
  button.ghost{
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    font-weight:400;padding:6px 10px;font-size:12px;
  }
  button.ghost:hover{border-color:var(--over);color:var(--over);}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{
    text-align:left;color:var(--text-dim);font-weight:400;
    padding:8px 8px;border-bottom:1px solid var(--border);font-size:11px;
  }
  td{padding:9px 8px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .cat-pill{
    display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;
    border:1px solid var(--border);color:var(--text-dim);
  }
  .empty-row td{color:var(--text-dim);text-align:center;padding:24px 0;}

  .budget-edit{display:flex;gap:10px;flex-wrap:wrap;}
  .budget-edit .field{flex:1;min-width:140px;}

  .status-msg{font-size:12px;color:var(--text-dim);margin-top:10px;min-height:16px;}
  .status-msg.error{color:var(--over);}

  #config-gate{
    max-width:520px;margin:80px auto;padding:0 20px;text-align:center;
  }
  #config-gate p{color:var(--text-dim);font-size:13px;line-height:1.6;margin-top:12px;}
  #config-gate code{background:var(--surface-alt);padding:2px 6px;border-radius:3px;}

  @media (max-width:600px){
    form.entry{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<div id="config-gate" style="display:none;">
  <div class="kicker">FIELD LEDGER</div>
  <h1 style="font-family:'Fraunces',serif;font-size:26px;">Not connected yet</h1>
  <p>Paste your Apps Script Web App URL into <code>CONFIG.apiUrl</code> near the top of the script section in this file, then reload.</p>
</div>

<div id="app" style="display:none;">
  <header>
    <div class="inner">
      <div class="kicker">FIELD LEDGER</div>
      <h1>Travel budget</h1>
      <div class="subline" id="trip-subline">Trip started —</div>
    </div>
  </header>

  <div class="wrap">
    <div class="week-tabs" id="week-tabs"></div>

    <div class="cards" id="cat-cards"></div>

    <div class="total-strip">
      <div>
        <div class="label">Week total</div>
        <div class="value" id="week-total-value">—</div>
      </div>
      <div style="text-align:right;">
        <div class="label">Budget</div>
        <div class="value" id="week-budget-value">—</div>
      </div>
    </div>

    <section class="panel">
      <h2>Log an expense</h2>
      <form class="entry" id="expense-form">
        <div>
          <label>Date</label>
          <input type="date" id="f-date" required>
        </div>
        <div>
          <label>Category</label>
          <select id="f-category" required></select>
        </div>
        <div>
          <label>Amount</label>
          <input type="number" step="0.01" id="f-amount" placeholder="0.00" required>
        </div>
        <div>
          <label>Payment</label>
          <select id="f-payment">
            <option>Card</option>
            <option>Cash</option>
          </select>
        </div>
        <div>
          <label>Country</label>
          <input type="text" id="f-country" placeholder="Costa Rica">
        </div>
        <div>
          <label>Notes</label>
          <input type="text" id="f-notes" placeholder="optional">
        </div>
        <div class="full">
          <button type="submit">Add expense</button>
          <div class="status-msg" id="form-status"></div>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>Weekly budgets</h2>
      <div class="budget-edit" id="budget-edit"></div>
    </section>

    <section class="panel">
      <h2 id="log-heading">Expense log</h2>
      <table>
        <thead>
          <tr><th>Date</th><th>Category</th><th>Amount</th><th>Payment</th><th>Country</th><th>Notes</th><th></th></tr>
        </thead>
        <tbody id="log-body"></tbody>
      </table>
    </section>
  </div>
</div>

<script>
const CONFIG = {
  apiUrl: 'https://script.google.com/macros/s/AKfycbzM0aYexNoGsurw39HyDV5ddK53p_ZDgYPuNIbvm6yEddL6KfoBkpKsPGEuz6aCqg1T/exec',
  currencySymbol: '€'
};

let STATE = { settings: null, budgets: [], expenses: [], selectedWeek: 1 };

function fmt(n){ return CONFIG.currencySymbol + Number(n).toFixed(2); }

async function loadData(){
  const res = await fetch(CONFIG.apiUrl);
  const data = await res.json();
  STATE.settings = data.settings;
  STATE.budgets = data.budgets;
  STATE.expenses = data.expenses.sort((a,b) => new Date(b.date) - new Date(a.date));
  if (!STATE.expenses.some(e => e.week === STATE.selectedWeek)) {
    STATE.selectedWeek = currentWeek();
  }
  render();
}

function currentWeek(){
  if (!STATE.settings || !STATE.settings.tripStartDate) return 1;
  const start = new Date(STATE.settings.tripStartDate);
  const now = new Date();
  const diffDays = Math.floor((stripTime(now) - stripTime(start)) / 86400000);
  return Math.max(1, Math.floor(diffDays/7)+1);
}
function stripTime(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }

function maxWeekSeen(){
  const fromExpenses = STATE.expenses.reduce((m,e) => Math.max(m, e.week), 0);
  return Math.max(fromExpenses, currentWeek());
}

function render(){
  document.getElementById('trip-subline').textContent =
    `Trip started ${STATE.settings.tripStartDate} · currently week ${currentWeek()}`;

  renderWeekTabs();
  renderCategoryCards();
  renderBudgetEdit();
  renderLog();
}

function renderWeekTabs(){
  const container = document.getElementById('week-tabs');
  container.innerHTML = '';
  const total = maxWeekSeen();
  for (let w=1; w<=total; w++){
    const btn = document.createElement('button');
    btn.className = 'week-tab' + (w === STATE.selectedWeek ? ' active' : '');
    btn.textContent = 'Week ' + w;
    btn.onclick = () => { STATE.selectedWeek = w; render(); };
    container.appendChild(btn);
  }
}

function renderCategoryCards(){
  const container = document.getElementById('cat-cards');
  container.innerHTML = '';
  const weekExpenses = STATE.expenses.filter(e => e.week === STATE.selectedWeek);

  let weekTotal = 0, weekBudgetTotal = 0;

  STATE.budgets.forEach(b => {
    const spent = weekExpenses.filter(e => e.category === b.category)
      .reduce((sum, e) => sum + e.amount, 0);
    weekTotal += spent;
    weekBudgetTotal += b.weeklyBudget;

    const pct = b.weeklyBudget > 0 ? Math.min(100, (spent / b.weeklyBudget) * 100) : 0;
    const over = spent > b.weeklyBudget;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="cat">${b.category}</div>
      <div class="nums">
        <span class="spent">${fmt(spent)}</span>
        <span class="of-budget">of ${fmt(b.weeklyBudget)}</span>
      </div>
      <div class="bar-track"><div class="bar-fill ${over ? 'over' : ''}" style="width:${pct}%"></div></div>
      <div class="status ${over ? 'over-text' : ''}">${over ? 'Over by ' + fmt(spent - b.weeklyBudget) : fmt(b.weeklyBudget - spent) + ' left'}</div>
    `;
    container.appendChild(card);
  });

  const totalEl = document.getElementById('week-total-value');
  totalEl.textContent = fmt(weekTotal);
  totalEl.className = 'value ' + (weekTotal > weekBudgetTotal ? 'over' : 'good');
  document.getElementById('week-budget-value').textContent = fmt(weekBudgetTotal);
}

function renderBudgetEdit(){
  const container = document.getElementById('budget-edit');
  container.innerHTML = '';
  STATE.budgets.forEach(b => {
    const field = document.createElement('div');
    field.className = 'field';
    field.innerHTML = `
      <label>${b.category} / week</label>
      <input type="number" step="1" value="${b.weeklyBudget}" data-category="${b.category}">
    `;
    const input = field.querySelector('input');
    input.addEventListener('change', async () => {
      await postAction({ action: 'updateBudget', category: b.category, amount: input.value });
      loadData();
    });
    container.appendChild(field);
  });
}

function renderLog(){
  const body = document.getElementById('log-body');
  body.innerHTML = '';
  const weekExpenses = STATE.expenses.filter(e => e.week === STATE.selectedWeek);
  document.getElementById('log-heading').textContent = `Expense log — week ${STATE.selectedWeek}`;

  if (weekExpenses.length === 0){
    body.innerHTML = '<tr class="empty-row"><td colspan="7">No expenses logged for this week yet.</td></tr>';
    return;
  }

  weekExpenses.forEach(e => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${e.date}</td>
      <td><span class="cat-pill">${e.category}</span></td>
      <td>${fmt(e.amount)}</td>
      <td>${e.paymentMethod || ''}</td>
      <td>${e.country || ''}</td>
      <td>${e.notes || ''}</td>
      <td><button class="ghost" data-id="${e.id}">Delete</button></td>
    `;
    row.querySelector('button').onclick = async (ev) => {
      await postAction({ action: 'deleteExpense', id: ev.target.dataset.id });
      loadData();
    };
    body.appendChild(row);
  });
}

async function postAction(payload){
  return fetch(CONFIG.apiUrl, {
    method: 'POST',
    body: JSON.stringify(payload)
  });
}

function populateCategorySelect(){
  const select = document.getElementById('f-category');
  select.innerHTML = '';
  STATE.budgets.forEach(b => {
    const opt = document.createElement('option');
    opt.value = b.category;
    opt.textContent = b.category;
    select.appendChild(opt);
  });
}

document.getElementById('expense-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const status = document.getElementById('form-status');
  status.textContent = 'Saving…';
  status.className = 'status-msg';

  const expense = {
    date: document.getElementById('f-date').value,
    category: document.getElementById('f-category').value,
    amount: document.getElementById('f-amount').value,
    paymentMethod: document.getElementById('f-payment').value,
    country: document.getElementById('f-country').value,
    notes: document.getElementById('f-notes').value
  };

  try {
    await postAction({ action: 'addExpense', expense });
    document.getElementById('expense-form').reset();
    document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
    status.textContent = 'Added.';
    await loadData();
  } catch (err) {
    status.textContent = 'Failed to save — check connection.';
    status.className = 'status-msg error';
  }
});

async function init(){
  if (!CONFIG.apiUrl || CONFIG.apiUrl.includes('PASTE_YOUR')){
    document.getElementById('config-gate').style.display = 'block';
    return;
  }
  document.getElementById('app').style.display = 'block';
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
  await loadData();
  populateCategorySelect();
}

init();
</script>
</body>
</html>
